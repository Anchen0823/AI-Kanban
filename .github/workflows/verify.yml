name: Verify
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:all
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: tmp/desktop-verification/*.png
  performance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @aicc/core
      - run: npm run verify:explorer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-performance
          path: tmp/explorer-performance.json
